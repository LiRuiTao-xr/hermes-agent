name: Sync fork with Hermes upstream

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 00:07
    - cron: "7 16 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main
